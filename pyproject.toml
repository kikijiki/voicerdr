[project]
name = "voicerdr"
version = "0.1.0"
description = "Configurable local voice assistant and Herdr speech-routing plugin"
readme = "README.md"
license = "MIT"
authors = [{ name = "Matteo Bernacchia", email = "dev@kikijiki.com" }]
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "pipecat-ai[kokoro,local,moonshine,openai,silero]>=1.8.1",
  "textual>=8.2.8",
]

[project.optional-dependencies]
dev = ["ruff>=0.8"]

[project.urls]
Repository = "https://github.com/kikijiki/voicerdr"

[project.scripts]
voicerdr = "voicerdr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voicerdr"]

[tool.hatch.build.targets.wheel.force-include]
"systemd/voicerdr.service.in" = "voicerdr/resources/voicerdr.service.in"

[tool.hatch.build.targets.sdist]
include = [
  "src/voicerdr",
  "tests",
  "config",
  "systemd",
  "scripts",
  "flake.nix",
  "flake.lock",
  "herdr-plugin.toml",
  "README.md",
  "LICENSE",
  "justfile",
  "uv.lock",
]

[tool.uv]
package = true
